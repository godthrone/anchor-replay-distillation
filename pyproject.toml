[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-replay-distillation"
dynamic = ["version"]
description = "Two-hop Anchor Replay Distillation data generation utilities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Godthrone" }]
dependencies = [
  "numpy>=1.26.0",
  "pydantic>=2.0",
  "tqdm>=4.0",
]

[project.optional-dependencies]
hf = [
  "transformers>=4.53.0",
]
embed = [
  "sentence-transformers>=3.0.0",
]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
ard = "ard.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
ard = ["py.typed"]

[tool.setuptools_scm]
tag_regex = "^(?:v)?(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE"]

[tool.mypy]
python_version = "3.11"
packages = ["ard"]
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.pytest_tmp"]