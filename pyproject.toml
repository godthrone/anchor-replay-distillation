[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-replay-distillation"
dynamic = ["version"]
description = "Two-hop Anchor Replay Distillation data generation utilities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "godthrone" }]
dependencies = [
  "httpx>=0.27",
  "Pillow>=10.0",
  "pydantic>=2.0",
  "tomli-w>=1.2",
  "tqdm>=4.0",
]

[project.optional-dependencies]
# RAW camera formats (.cr2/.nef/.arw/.dng, ...) only.  The rawpy wheel bundles
# LibRaw (LGPL-2.1 / CDDL-1.0), so it is opt-in rather than a default dependency.
# numpy comes with it: the RAW decode path hands a rawpy array to
# Image.fromarray, so only that path needs it.  `rawpy` already depends on
# numpy, so listing it here costs nothing extra and documents the requirement.
raw = [
  "numpy>=1.26.0",
  "rawpy>=0.24",
]
dev = [
  "mypy>=1.11.0",
  # numpy is a dev dependency because tests/domain/test_image_store.py imports
  # it directly to check the RAW decode path.
  "numpy>=1.26.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
ard = "ard.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
ard = ["py.typed"]

[tool.setuptools_scm]
tag_regex = "^(?:v)?(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
# A `git clone` derives the version from tags; a source archive exported without
# `.git` (GitHub "Download ZIP", `git archive`) cannot, and setuptools-scm would
# abort the build instead of letting `uv sync` install the tree.  1.0.0 is the
# value the repository already uses for "no git metadata" in `run.sh:4` and
# `docker/build.sh:3`, so the archive path reports the same version as the
# Docker path instead of inventing a third one (§1.4).
fallback_version = "1.0.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE"]

[tool.mypy]
python_version = "3.11"
packages = ["ard"]
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.pytest_tmp"]
markers = ["slow: long-running timing tests"]