# ARD — Override configuration template.
# Copy to .local/config.override.toml and fill in your values.
# .local/config.override.toml is gitignored — never commit real secrets.
#
# This file mirrors ALL fields from configs/config.toml.
# You CANNOT add new sections or fields not present in config.toml.

[input_generator]
# Base URL for the OpenAI-compatible API endpoint
# api_base = "http://localhost:8000/v1"
# Model name to use
# model_name = "your-model"
# API key (leave commented if not needed)
# api_key = ""
# Sampling temperature (0.0 = deterministic)
# temperature = 0.8
# Maximum tokens per response
# max_tokens = 32768
# TCP connection + TLS handshake timeout
# connect_timeout = 10.0
# Maximum wait for first SSE line (prefill + queue). Default: 300s
# first_token_timeout = 300.0
# Maximum wait between SSE lines after first token. Default: 15s
# inter_token_timeout = 15.0
# Number of retries on failure
# max_retries = 3
# Whether to retry on timeout errors (requires max_retries > 0)
# retry_on_timeout = false

[target_model]
# Base URL for the OpenAI-compatible API endpoint
# api_base = "http://localhost:8000/v1"
# Model name to use
# model_name = "your-model"
# API key (leave commented if not needed)
# api_key = ""
# Sampling temperature (0.0 = deterministic)
# temperature = 0.0
# Maximum tokens per response
# max_tokens = 32768
# TCP connection + TLS handshake timeout
# connect_timeout = 10.0
# Maximum wait for first SSE line (prefill + queue). Default: 300s
# first_token_timeout = 300.0
# Maximum wait between SSE lines after first token. Default: 15s
# inter_token_timeout = 15.0
# Number of retries on failure
# max_retries = 3
# Whether to retry on timeout errors (requires max_retries > 0)
# retry_on_timeout = false
# Enable thinking/reasoning mode (Qwen3, DeepSeek-R1, etc.)
# Uncomment to override: false = disable reasoning, true = enable.
# enable_thinking = false

[generation]
# Number of anchors to generate
target_count = 100
# Random seed for reproducibility
seed = 42
# Number of concurrent API requests (higher = faster, but may hit rate limits)
concurrency = 4
# Language filter (empty = use all available from ontology)
languages = []
# Task type filter (empty = use all available from ontology)
task_types = []
# Maximum conversation turns (1 = single-turn, 2-10 = multi-turn)
max_turns = 1
# System prompt is a sampling dimension, not a config switch: the ontology
# (system_prompt_presence / system_prompt_style) decides whether each anchor
# carries one and in which style. See docs/architecture.md.
# Maximum turns with image per anchor (must be <= max_turns)
max_turns_with_image = 1
# Path to pre-computed ontology embeddings for farthest-point sampling
embeddings_path = "ontology/anchor_ontology_embeddings.json"
# Consecutive server-side failures (timeouts / transport errors) that trigger
# the backpressure cooldown below. Model-output failures (empty content,
# missing log-probs) are counted separately and never trigger a cooldown.
# backpressure_threshold = 3
# Backpressure cooldown pause in seconds, applied once the threshold is hit
# backpressure_cooldown = 60.0

[ontology]
# Path to the ontology JSON file
path = "ontology/anchor_ontology.json"

[output]
# Output directory (empty = auto-generated under outputs/)
directory = ""
# Whether to overwrite existing output directory
overwrite = false