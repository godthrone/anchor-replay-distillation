# ARD — Override configuration template.
# Copy to .local/config.override.toml and fill in your values.
# .local/config.override.toml is gitignored — never commit real secrets.
#
# This file mirrors ALL fields from configs/config.toml.
# You CANNOT add new sections or fields not present in config.toml.

[input_generator]
# API endpoint URL (OpenAI-compatible)
api_base = "REPLACE_ME"
# Model name as registered in the API
model_name = "REPLACE_ME"
# API key (leave empty if not required)
api_key = "REPLACE_ME"
# Sampling temperature for question generation
temperature = 0.8
# Maximum tokens per response
max_tokens = 4096
# Request timeout in seconds
timeout = 120.0
# Number of retries on failure
max_retries = 3

[target_model]
# API endpoint URL (OpenAI-compatible)
api_base = "REPLACE_ME"
# Model name for the teacher model
model_name = "REPLACE_ME"
# API key (leave empty if not required)
api_key = "REPLACE_ME"
# Sampling temperature for answer generation (0.0 = deterministic)
temperature = 0.0
# Maximum tokens per response
max_tokens = 4096
# Request timeout in seconds
timeout = 120.0
# Number of retries on failure
max_retries = 3

[generation]
# Number of anchors to generate
target_count = 100
# Random seed for reproducibility
seed = 42
# Language filter (empty = all available)
languages = []
# Task type filter (empty = all available)
task_types = []
# Number of concurrent API requests
concurrency = 4

[ontology]
# Path to the ontology JSON file
path = "data/anchor_ontology.json"

[output]
# Output directory (empty = auto-generated under outputs/)
directory = ""
# Whether to overwrite existing output directory
overwrite = false