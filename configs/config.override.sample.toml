# ARD — Override configuration template.
# Copy to .local/config.override.toml and fill in your values.
# .local/config.override.toml is gitignored — never commit real secrets.
#
# This file mirrors ALL fields from configs/config.toml.
# You CANNOT add new sections or fields not present in config.toml.

[input_generator]
# Base URL for the OpenAI-compatible API endpoint
# api_base = "http://localhost:8000/v1"
# Model name to use
# model_name = "your-model"
# API key (leave commented if not needed)
# api_key = ""
# Sampling temperature (default 0.8 — input/question-generator side, §R12)
# temperature = 0.8
# Maximum tokens per response
# max_tokens = 32768
# TCP connection + TLS handshake timeout
# connect_timeout = 10.0
# Maximum wait for first SSE line (prefill + queue). Default: 300s
# first_token_timeout = 300.0
# Maximum wait between SSE lines after first token. Default: 15s
# inter_token_timeout = 15.0
# Number of retries on failure
# max_retries = 3
# Whether to retry on timeout errors (requires max_retries > 0)
# retry_on_timeout = false

[target_model]
# Base URL for the OpenAI-compatible API endpoint
# api_base = "http://localhost:8000/v1"
# Model name to use
# model_name = "your-model"
# API key (leave commented if not needed)
# api_key = ""
# Sampling temperature for the target/teacher model (默认：目标作答模型=教师端)
# temperature = 0.1
# Maximum tokens per response
# max_tokens = 32768
# TCP connection + TLS handshake timeout
# connect_timeout = 10.0
# Maximum wait for first SSE line (prefill + queue). Default: 300s
# first_token_timeout = 300.0
# Maximum wait between SSE lines after first token. Default: 15s
# inter_token_timeout = 15.0
# Number of retries on failure
# max_retries = 3
# Whether to retry on timeout errors (requires max_retries > 0)
# retry_on_timeout = false
# Enable thinking/reasoning mode (Qwen3, DeepSeek-R1, etc.)
# Uncomment to override: false = disable reasoning, true = enable.
# enable_thinking = false

[generation]
# The anchor count is NOT configurable: the v4 construction rule derives it
# from the ontology (935 text-only + 891 image-capable = 1,826 anchors).
# Sampling seed (optional). Omit — the default — and every run draws a fresh
# seed from the system random source; set an integer to pin this run's sampling
# order. The seed actually used is recorded in <output_dir>/config.json.
# seed = 42
# Number of concurrent API requests (higher = faster, but may hit rate limits)
concurrency = 4
# Conversation turns are NOT configurable: each anchor's turn count is the
# `turns` attribute its ontology `conversation_type` declares.
# Consecutive server-side failures (timeouts / transport errors) that trigger
# the backpressure cooldown below. Model-output failures (empty content) are
# counted separately and never trigger a cooldown.
# backpressure_threshold = 3
# Backpressure cooldown pause in seconds, applied once the threshold is hit
# backpressure_cooldown = 60.0

[ontology]
# Path to the ontology JSON file
path = "ontology/anchor_ontology.v4.json"

[output]
# Output directory (empty = auto-generated under outputs/)
directory = ""
# Whether to overwrite existing output directory
overwrite = false

[images]
# Image addressing convention: <image_dir>/<visual_domain>/<image file>, where
# <image_dir> comes from --image-dir. A missing/empty domain directory is
# refused by default; set this to true to skip those anchors (logged as a
# WARNING and declared in manifest.json), never silently.
# skip_missing_images = false
# Transcode each selected image to JPEG while copying it into the output tree
# (true, the default) instead of copying already-web formats verbatim (false).
# This decides what lands in <output_dir>/images, so it lives in the config
# rather than on the command line (§10.1). `convert = true` is the historical
# default behaviour.
# convert = true

[coverage]
# Whether to run the acceptance phase (structure readout + optional metric
# readout). Default: true.
# enabled = true
# Target-set file for the metric readout (q95 / Extent(epsilon) / epsilon band).
# Empty (the default) = structure readout only, announced with a WARNING.
# Relative paths resolve against the working directory, like ontology.path.
# Format: JSON (array, or object with a "targets" array) or JSONL; each entry is
# a non-empty string or an object with a non-empty "text" field; an optional
# object header may declare "expected_count", "dimension" and "epsilon".
# target_set_path = "path/to/target_set.jsonl"

[coverage.embedding]
# Base URL for the OpenAI-compatible embeddings endpoint (including /v1)
# api_base = "http://localhost:8000/v1"
# API key (leave commented if the server needs none) — never commit a real key
# api_key = ""
# Embedding model name
# model = "your-embedding-model"
# Expected vector length (required when target_set_path is set)
# dimension = 384
# Texts per HTTP request
# batch_size = 32
# TCP connect + TLS handshake timeout
# connect_timeout = 10.0
# Whole-response read budget
# read_timeout = 60.0
# Retries after the first attempt (0 = exactly one attempt)
# max_retries = 2
# Must stay true: coverage.VectorSet requires L2-normalised rows
# normalize = true