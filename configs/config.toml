# ARD — Anchor Replay Distillation
# Base configuration. All fields are defined here.
# Deployment fields (endpoints, API keys) are left empty — fill them in config.override.toml
# See configs/config.override.sample.toml for an example.

# Input generator (question generator) — produces the user turn (the
# "questioning" side; downstream training pipelines have no counterpart for it).
[input_generator]
api_base = ""
model_name = ""
api_key = ""
temperature = 0.8
# Maximum tokens in the response. Comment out (or delete) to let the API
# provider decide (recommended for most use cases).
# Uncomment and set a value to enforce a limit.
# max_tokens = 32768
connect_timeout = 10.0
# Prefill + queue wait timeout. Default: 300s (5 minutes)
first_token_timeout = 300.0
inter_token_timeout = 15.0
max_retries = 3
retry_on_timeout = false

# Target answering model (= teacher side).  Its answer IS the supervision
# target (targets[0].output) — "whose output is the target answer is the
# teacher".  The student model is not part of ARD (downstream training owns it).
[target_model]
api_base = ""
model_name = ""
api_key = ""
temperature = 0.1
# Maximum tokens in the response. Comment out (or delete) to let the API
# provider decide (recommended for most use cases).
# Uncomment and set a value to enforce a limit.
# max_tokens = 32768
connect_timeout = 10.0
# Prefill + queue wait timeout. Default: 300s (5 minutes)
first_token_timeout = 300.0
inter_token_timeout = 15.0
max_retries = 3
retry_on_timeout = false
# Enable thinking/reasoning mode (Qwen3, DeepSeek-R1, etc.)
# When True, the model outputs reasoning before the final answer.
# Only enable when distilling to a reasoning-capable student model.
# This value is always sent to the server: false = disable, true = enable.
enable_thinking = false

[generation]
# Anchor count N: how many anchors this run produces. Omit (the default) = one
# full round, i.e. the round's unit count U — one unit per legal restricted
# block, rotated over the knowledge / visual leaves. U is derived from the
# ontology at run time, never hand-copied here (recount command: see
# docs/algorithm.md §1.1). There is NO upper bound: N rolls on across rounds
# (finishing a round simply starts the next one), and anchor-id uniqueness is
# what keeps the plan valid — not a rejection threshold. When set it must be an
# integer >= 1; 0 / negative values are refused at config load.
# count = 1826
# Sampling seed. Omit (the default) = draw a fresh seed from the system random
# source on every run; set an integer to pin one run's sampling order and make
# it reproducible. The seed actually used is recorded in <output_dir>/config.toml.
# seed = 42
# Number of concurrent API requests (higher = faster, but may hit rate limits)
concurrency = 4
# Conversation turns are NOT configurable: each anchor's turn count is
# the `turns` attribute its ontology `conversation_type` declares.

# Consecutive timeouts to trigger backpressure cooldown
backpressure_threshold = 3
# Backpressure cooldown pause in seconds
backpressure_cooldown = 60.0

[ontology]
path = "ontology/anchor_ontology.v4.json"

[output]
# Output directory path. Leave empty to auto-generate: outputs/ard_dataset_<timestamp>
directory = ""
# When true: clear any existing anchor bank and start fresh.
# When false: resume from existing anchors (checkpoint/resume) if anchor_bank.jsonl
# already exists in the output directory. If the directory is empty or has no
# anchor data, generation proceeds normally.
overwrite = false

[images]
# How an image-modality anchor's picture is found: one subdirectory per
# visual_domain under the directory passed to --image-dir, i.e.
#   <image_dir>/<visual_domain>/<image file>
# (e.g. <image_dir>/animals/sample_01.jpg).
#
# A domain that has no picture of its own REUSES one from the whole image tree
# instead of losing its anchors: the run falls back to every usable image under
# <image_dir> (in a deterministic order) and rotates through it. Supply a
# single picture and a run of any size is complete — every domain, every round,
# that picture; whether that is good enough for the dataset is the user's
# judgement, which is why each such reuse is logged and counted in
# manifest.json (fallback_visual_domains / fallback_anchor_count, plus the
# per-row "fallback" flag in resolved_images).
#
# Only a tree that holds NO usable image at all leaves a domain without a
# picture. That state is refused by default (the error lists the domains left
# without a picture, the directories they would be read from and the number of
# affected anchors). Set the switch below to skip those anchors instead — the
# artifact then differs from the construction rule, so each skipped anchor is
# logged as a WARNING and the skipped count and visual domains are declared in
# manifest.json.
skip_missing_images = false

# Transcode each selected image to JPEG while copying it into <output_dir>/images.
# true  = accept RAW / BMP / TIFF / GIF / WebP sources and normalise them to JPEG.
# false = accept only PNG / JPEG / GIF / WebP and copy those bytes verbatim.
# This changes what lands in <output_dir>/images, so it is a config field
# (§10.1): the archived config.toml then describes the artifact on its own.
# `convert = true` is the behaviour every pre-v4 run had by default.
convert = true

[coverage]
# Acceptance readout of a run, written to <output_dir>/results/coverage.json and
# coverage.md after generation and before the manifest.
# The report is the structure readout (plan counts vs the construction rule): it
# needs no model call, no endpoint and no target set, and is always produced when
# the phase is enabled.
# Set false to skip the phase entirely.
enabled = true