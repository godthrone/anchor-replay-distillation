# ARD — Anchor Replay Distillation
# Base configuration. All fields are defined here.
# Secret fields (API keys, endpoints) are left empty — fill them in config.override.toml
# See configs/config.override.sample.toml for an example.

[input_generator]
api_base = ""
model_name = ""
api_key = ""
temperature = 0.8
max_tokens = 4096
timeout = 120.0
max_retries = 3

[target_model]
api_base = ""
model_name = ""
api_key = ""
temperature = 0.0
max_tokens = 4096
timeout = 120.0
max_retries = 3

[generation]
target_count = 100
seed = 42
# Number of concurrent API requests (higher = faster, but may hit rate limits)
concurrency = 4
# Empty list = use all available values from ontology
languages = []
task_types = []
# Maximum conversation turns (1 = single-turn, 2-10 = multi-turn)
max_turns = 1
# System persona mode: "none" | "one_sentence" | "appropriate" | "detailed"
system_persona = "none"
# Maximum turns with image per anchor (must be <= max_turns)
max_turns_with_image = 1

[ontology]
path = "data/anchor_ontology.json"

[output]
directory = ""
overwrite = false