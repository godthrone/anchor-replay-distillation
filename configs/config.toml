# ARD — Anchor Replay Distillation
# Base configuration. All fields are defined here.
# Secret fields (API keys, endpoints) are left empty — fill them in config.override.toml
# See configs/config.override.sample.toml for an example.

# Input generator (question generator) — produces the user turn (the
# "questioning" side; SFT/OPD have no counterpart for it).
[input_generator]
api_base = ""
model_name = ""
api_key = ""
temperature = 0.8
# Maximum tokens in the response. Comment out (or delete) to let the API
# provider decide (recommended for most use cases).
# Uncomment and set a value to enforce a limit.
# max_tokens = 32768
connect_timeout = 10.0
# Prefill + queue wait timeout. Default: 300s (5 minutes)
first_token_timeout = 300.0
inter_token_timeout = 15.0
max_retries = 3
retry_on_timeout = false

# Target answering model (= teacher side).  Its answer IS the supervision
# target (targets[0].output) — "whose output is the target answer is the
# teacher".  The student model is not part of ARD (graspo/SFT own it).
[target_model]
api_base = ""
model_name = ""
api_key = ""
temperature = 0.1
# Maximum tokens in the response. Comment out (or delete) to let the API
# provider decide (recommended for most use cases).
# Uncomment and set a value to enforce a limit.
# max_tokens = 32768
connect_timeout = 10.0
# Prefill + queue wait timeout. Default: 300s (5 minutes)
first_token_timeout = 300.0
inter_token_timeout = 15.0
max_retries = 3
retry_on_timeout = false
# Enable thinking/reasoning mode (Qwen3, DeepSeek-R1, etc.)
# When True, the model outputs reasoning before the final answer.
# Only enable when distilling to a reasoning-capable student model.
# This value is always sent to the server: false = disable, true = enable.
enable_thinking = false

[generation]
# The anchor count is NOT configurable: the v4 construction rule derives it
# from the ontology (one sample per legal restricted block, one per rotated
# knowledge/visual leaf). See docs/algorithm.md in the documentation work
# package; the plan is 935 text-only + 891 image-capable = 1,826 anchors.
# Sampling seed. Omit (the default) = draw a fresh seed from the system random
# source on every run; set an integer to pin one run's sampling order and make
# it reproducible. The seed actually used is recorded in <output_dir>/config.json.
# seed = 42
# Number of concurrent API requests (higher = faster, but may hit rate limits)
concurrency = 4
# Conversation turns are NOT configurable either: each anchor's turn count is
# the `turns` attribute its ontology `conversation_type` declares.

# Consecutive timeouts to trigger backpressure cooldown
backpressure_threshold = 3
# Backpressure cooldown pause in seconds
backpressure_cooldown = 60.0

[ontology]
path = "ontology/anchor_ontology.v4.json"

[output]
# Output directory path. Leave empty to auto-generate: outputs/ard_dataset_<timestamp>
directory = ""
# When true: clear any existing anchor bank and start fresh.
# When false: resume from existing anchors (checkpoint/resume) if anchor_bank.jsonl
# already exists in the output directory. If the directory is empty or has no
# anchor data, generation proceeds normally.
overwrite = false

[images]
# How an image-modality anchor's picture is found: one subdirectory per
# visual_domain under the directory passed to --image-dir, i.e.
#   <image_dir>/<visual_domain>/<image file>
# (e.g. <image_dir>/animals/sample_01.jpg). Files directly in <image_dir> are
# NOT used: an image drawn from a flat pool cannot be guaranteed to match the
# visual_domain coordinate it is attached to, which would mislabel the anchor.
#
# A required visual_domain whose subdirectory is missing or holds no supported
# image is refused by default (the error lists the missing domains, their
# expected paths and the number of affected anchors). Set the switch below to
# skip those anchors instead — the artifact then differs from the construction
# rule, so each skipped anchor is logged as a WARNING and the skipped count and
# visual domains are declared in manifest.json.
skip_missing_images = false

# Transcode each selected image to JPEG while copying it into <output_dir>/images.
# true  = accept RAW / BMP / TIFF / GIF / WebP sources and normalise them to JPEG.
# false = accept only PNG / JPEG / GIF / WebP and copy those bytes verbatim.
# This changes what lands in <output_dir>/images, so it is a config field
# (§10.1): the archived config.toml then describes the artifact on its own.
# `convert = true` is the behaviour every pre-v4 run had by default.
convert = true

[coverage]
# Acceptance readout of a run, written to <output_dir>/results/coverage.json and
# coverage.md after generation and before the manifest.
# The structure readout (plan counts vs the construction rule) needs no model
# call and is always produced when the phase is enabled.
# Set false to skip the acceptance phase entirely.
enabled = true
# Target set for the metric readout (q95 / Extent(epsilon) / epsilon band).
# Leave empty to publish the structure readout only: the run then announces in a
# WARNING that no metric readout was measured (never silently).
# Format: JSON (array, or object with a "targets" array) or JSONL. Every entry
# is a non-empty string or an object with a non-empty "text" field. An optional
# object header may also declare "expected_count", "dimension" and "epsilon"
# (a declared epsilon is used as-is; otherwise the target set's own median
# nearest-neighbour distance calibrates it).
target_set_path = ""

[coverage.embedding]
# OpenAI-compatible /embeddings endpoint used by the metric readout only.
api_base = ""
# Secret — leave empty here and put the real key in config.override.toml.
api_key = ""
model = ""
# Expected vector length. Required when target_set_path is set.
# dimension = 384
# Texts per HTTP request.
batch_size = 32
# TCP connect + TLS handshake timeout, in seconds.
connect_timeout = 10.0
# Whole-response read budget, in seconds.
read_timeout = 60.0
# Retries after the first attempt (0 = exactly one attempt).
max_retries = 2
# Must stay true: the acceptance ruler (coverage.VectorSet) requires
# L2-normalised rows so that dot == cos and distance == 1 - cos.
normalize = true